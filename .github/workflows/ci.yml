name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']

jobs:
  foundation:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: millq
          POSTGRES_PASSWORD: millq
          POSTGRES_DB: millq_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U millq -d millq_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://millq:millq@localhost:5432/millq_dev
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Backup script auth tests
        run: bash tests/scripts/backup-origin-to-github.test.sh
      - name: Disposable CI assertion script tests
        run: bash tests/scripts/assert-vitest-no-skips.test.sh
      - name: Build
        run: pnpm build
      - name: Migrate (idempotent smoke)
        run: |
          pnpm --filter @millq/api run migrate
          pnpm --filter @millq/api run migrate
      - name: API health with live PostgreSQL
        run: |
          set -o pipefail
          pnpm --filter @millq/api run start &
          API_PID=$!
          HEALTH_OK=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health -o /tmp/health.json; then
              HEALTH_OK=1
              break
            fi
            sleep 1
          done
          kill $API_PID || true
          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "API health check failed after 30 attempts"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          data = json.load(open('/tmp/health.json'))
          assert data.get('status') == 'ok', data
          assert data.get('checks', {}).get('database') == 'up', data
          print('health ok')
          PY
  disposable-pg-acceptance:
    name: Disposable PostgreSQL P0 + migrator
    runs-on: ubuntu-latest
    services:
      postgres:
        # Isolated service for this job only — not millq_dev / staging / production.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: millq_ci
          POSTGRES_PASSWORD: millq_ci_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U millq_ci -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: millq_ci
      PGPASSWORD: millq_ci_local_only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Fresh CI checkout has no package dist/; POS suite imports @millq/domain via package exports.
      - name: Build workspace packages required by API tests
        run: pnpm --filter @millq/domain --filter @millq/contracts run build
      - name: Fail-closed assertion script unit tests
        run: bash tests/scripts/assert-vitest-no-skips.test.sh
      - name: Wait for disposable PostgreSQL
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U millq_ci -d postgres \
              || docker run --rm --network host postgres:16-alpine \
                   pg_isready -h 127.0.0.1 -p 5432 -U millq_ci -d postgres; then
              echo "disposable PostgreSQL ready"
              exit 0
            fi
            sleep 1
          done
          echo "disposable PostgreSQL did not become ready" >&2
          exit 1
      - name: Create per-run databases
        id: dbs
        run: |
          set -euo pipefail
          psql_ci() {
            if command -v psql >/dev/null 2>&1; then
              PGPASSWORD=millq_ci_local_only psql -h 127.0.0.1 -U millq_ci -d postgres -v ON_ERROR_STOP=1 "$@"
            else
              docker run --rm --network host -e PGPASSWORD=millq_ci_local_only postgres:16-alpine \
                psql -h 127.0.0.1 -U millq_ci -d postgres -v ON_ERROR_STOP=1 "$@"
            fi
          }
          RUN_SUFFIX="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          MIGRATE_DB="millq_migrate_runner_${RUN_SUFFIX}"
          POS_DB="millq_ci_pos_${RUN_SUFFIX}"
          GOLDEN_DB="millq_ci_pos_c0golden_${RUN_SUFFIX}"
          GR_DB="millq_ci_gr_${RUN_SUFFIX}"
          psql_ci -c "CREATE DATABASE \"${MIGRATE_DB}\" OWNER millq_ci;"
          psql_ci -c "CREATE DATABASE \"${POS_DB}\" OWNER millq_ci;"
          psql_ci -c "CREATE DATABASE \"${GOLDEN_DB}\" OWNER millq_ci;"
          psql_ci -c "CREATE DATABASE \"${GR_DB}\" OWNER millq_ci;"
          MIGRATE_URL="postgresql://millq_ci:millq_ci_local_only@127.0.0.1:5432/${MIGRATE_DB}"
          POS_URL="postgresql://millq_ci:millq_ci_local_only@127.0.0.1:5432/${POS_DB}"
          GOLDEN_URL="postgresql://millq_ci:millq_ci_local_only@127.0.0.1:5432/${GOLDEN_DB}"
          GR_URL="postgresql://millq_ci:millq_ci_local_only@127.0.0.1:5432/${GR_DB}"
          echo "migrate_db=${MIGRATE_DB}" >> "$GITHUB_OUTPUT"
          echo "pos_db=${POS_DB}" >> "$GITHUB_OUTPUT"
          echo "golden_db=${GOLDEN_DB}" >> "$GITHUB_OUTPUT"
          echo "gr_db=${GR_DB}" >> "$GITHUB_OUTPUT"
          echo "migrate_url=${MIGRATE_URL}" >> "$GITHUB_OUTPUT"
          echo "pos_url=${POS_URL}" >> "$GITHUB_OUTPUT"
          echo "golden_url=${GOLDEN_URL}" >> "$GITHUB_OUTPUT"
          echo "gr_url=${GR_URL}" >> "$GITHUB_OUTPUT"
          node scripts/ci/assert-disposable-database-url.mjs "$MIGRATE_URL"
          node scripts/ci/assert-disposable-database-url.mjs "$POS_URL"
          node scripts/ci/assert-disposable-database-url.mjs "$GOLDEN_URL"
          node scripts/ci/assert-disposable-database-url.mjs "$GR_URL"
      - name: Migrate POS disposable database
        run: |
          set -euo pipefail
          POS_DB="${{ steps.dbs.outputs.pos_db }}"
          export DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${POS_DB}"
          node scripts/ci/assert-disposable-database-url.mjs "$DATABASE_URL"
          pnpm --filter @millq/api run migrate
      - name: Imprint I-02 persistence acceptance (fail-closed)
        env:
          DATABASE_URL: ${{ steps.dbs.outputs.pos_url }}
        run: |
          set -euo pipefail
          POS_DB="${{ steps.dbs.outputs.pos_db }}"
          export DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${POS_DB}"
          node scripts/ci/assert-disposable-database-url.mjs "$DATABASE_URL"
          node -e 'const u=process.env.DATABASE_URL||""; const n=u.split("/").pop()?.split("?")[0]||""; if(!n.startsWith("millq_ci_pos_")) process.exit(1); console.log("pos_db_name="+n);'
          REPORT=/tmp/vitest-imprint-i02.json
          set +e
          pnpm --filter @millq/api exec vitest run \
            src/modules/restaurant-imprint/imprint-persistence.acceptance.test.ts \
            --reporter=verbose \
            --reporter=json \
            --outputFile="$REPORT"
          VITEST_EC=$?
          set -e
          node scripts/ci/print-vitest-summary.mjs "$REPORT" || true
          if [[ "$VITEST_EC" -ne 0 ]]; then
            echo "vitest exited with code ${VITEST_EC}" >&2
            exit "$VITEST_EC"
          fi
          node scripts/ci/assert-vitest-no-skips.mjs "$REPORT" --min-passed=11 --label=imprint-i02
      - name: Imprint I-04 claim service acceptance (fail-closed)
        env:
          DATABASE_URL: ${{ steps.dbs.outputs.pos_url }}
        run: |
          set -euo pipefail
          POS_DB="${{ steps.dbs.outputs.pos_db }}"
          export DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${POS_DB}"
          node scripts/ci/assert-disposable-database-url.mjs "$DATABASE_URL"
          node -e 'const u=process.env.DATABASE_URL||""; const n=u.split("/").pop()?.split("?")[0]||""; if(!n.startsWith("millq_ci_pos_")) process.exit(1); console.log("pos_db_name="+n);'
          REPORT=/tmp/vitest-imprint-i04.json
          set +e
          pnpm --filter @millq/api exec vitest run \
            src/modules/restaurant-imprint/imprint-claim-service.acceptance.test.ts \
            --reporter=verbose \
            --reporter=json \
            --outputFile="$REPORT"
          VITEST_EC=$?
          set -e
          node scripts/ci/print-vitest-summary.mjs "$REPORT" || true
          if [[ "$VITEST_EC" -ne 0 ]]; then
