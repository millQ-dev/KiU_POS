      - name: GoodsReceipt reverse UNIQUE + P0 concurrency (fail-closed)
        run: |
          set -euo pipefail
          GR_DB="${{ steps.dbs.outputs.gr_db }}"
          export DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${GR_DB}"
          node scripts/ci/assert-disposable-database-url.mjs "$DATABASE_URL"
