name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']

jobs:
  foundation:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: millq
          POSTGRES_PASSWORD: millq
          POSTGRES_DB: millq_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U millq -d millq_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://millq:millq@localhost:5432/millq_dev
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Backup script auth tests
        run: bash tests/scripts/backup-origin-to-github.test.sh
      - name: Build
        run: pnpm build
      - name: Migrate (idempotent smoke)
        run: |
          pnpm --filter @millq/api run migrate
          pnpm --filter @millq/api run migrate
      - name: API health with live PostgreSQL
        run: |
          set -o pipefail
          pnpm --filter @millq/api run start &
          API_PID=$!
          HEALTH_OK=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health -o /tmp/health.json; then
              HEALTH_OK=1
              break
            fi
            sleep 1
          done
          kill $API_PID || true
          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "API health check failed after 30 attempts"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          data = json.load(open('/tmp/health.json'))
          assert data.get('status') == 'ok', data
          assert data.get('checks', {}).get('database') == 'up', data
          print('health ok')
          PY
