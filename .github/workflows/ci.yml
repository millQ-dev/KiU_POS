            exit "$VITEST_EC"
          fi
          node scripts/ci/assert-vitest-no-skips.mjs "$REPORT" --min-passed=8 --label=cash12-close
      - name: Migrate C0 golden path disposable database
        run: |
          set -euo pipefail
          GOLDEN_DB="${{ steps.dbs.outputs.golden_db }}"
          export DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${GOLDEN_DB}"
          node scripts/ci/assert-disposable-database-url.mjs "$DATABASE_URL"
          node -e 'const u=process.env.DATABASE_URL||""; const n=u.split("/").pop()?.split("?")[0]||""; if(!n.startsWith("millq_ci_pos_")) process.exit(1); console.log("golden_db_name="+n);'
          pnpm --filter @millq/api run migrate
      - name: C0 combined Golden Path acceptance (fail-closed)
        run: |
          set -euo pipefail
          # Fresh millq_ci_pos_* only. Do not export MILLQ_ALLOW_FISCAL_TEST_ADAPTER.
          # The scenario opts into the disposable test adapter itself.
